<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>服务器实时监控</title>
<style>
  :root{
    --accent:#0f6bff;
    --bg:#f1f2f4;
    --card:#ffffff;
    --text:#1f2329;
    --mute:#8a9099;
    --border:#e3e6ea;
    --ok:#16a34a;
    --danger:#dc2626;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px;}
  h1{font-size:23px;font-weight:700;margin:0 0 16px;}

  /* ===== 离线横幅 ===== */
  .offline-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--danger);color:#fff;border-radius:6px;padding:11px 16px;
    margin-bottom:16px;font-size:14px;box-shadow:0 2px 8px rgba(220,38,38,.25);}
  .offline-banner .dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:#fff;
    animation:pulse 1s ease-in-out infinite;}
  .offline-banner .txt{font-weight:600;}
  .offline-banner .detail{font-weight:400;opacity:.92;font-size:13px;}
  .offline-banner .retry{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.6);
    border-radius:4px;padding:5px 12px;font-size:13px;cursor:pointer;}
  .offline-banner .retry:hover{background:rgba(255,255,255,.3);}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(.7);}}

  .info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 32px;margin-bottom:18px;}
  .info .item{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .info .v{font-weight:600;}
  body.is-offline .info .v{opacity:.4;}          /* 离线时旧数据变淡，表示已过期 */
  body.is-offline .info{filter:grayscale(.6);}

  .ranges{display:flex;flex-wrap:wrap;gap:8px;}
  .ranges button{min-width:62px;padding:6px 14px;font-size:13px;border:1px solid transparent;border-radius:4px;
    background:#fff;color:#333;cursor:pointer;transition:.15s;}
  .ranges button:hover{border-color:var(--accent);color:var(--accent);}
  .ranges button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .toggles{display:flex;flex-wrap:wrap;gap:18px;margin:14px 0 12px;font-size:13px;}
  .toggles label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
  .toggles input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}

  /* ===== 图表卡片 + 离线遮罩 ===== */
  .card{position:relative;background:var(--card);border-radius:6px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);padding:8px 6px 4px;}
  #chart{width:100%;height:430px;}
  body.is-offline #chart{filter:grayscale(.55);}
  .offline-mask{position:absolute;inset:0;z-index:5;border-radius:6px;
    background:rgba(255,255,255,.75);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;}
  .offline-mask .big{font-size:20px;font-weight:700;color:#b91c1c;}
  .offline-mask .sub{font-size:13px;color:#6b7280;max-width:520px;word-break:break-all;}

  .status{margin-top:10px;font-size:12px;color:var(--mute);}
  .status.ok{color:var(--ok);}
  .status.err{color:var(--danger);}

  /* ===== 恢复提示 toast ===== */
  .flash{position:fixed;top:16px;right:16px;z-index:99;background:var(--ok);color:#fff;
    padding:9px 16px;border-radius:6px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.16);}

  @media (max-width:640px){ #chart{height:320px;} .info{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">

  <!-- 主服务器离线提示（默认隐藏） -->
  <div class="offline-banner" id="offlineBanner" hidden>
    <span class="dot"></span>
    <span>
      <span class="txt">主服务器离线</span>
      <span class="detail" id="offlineDetail">无法连接 api.php</span>
    </span>
    <button class="retry" id="retryBtn" type="button">立即重试</button>
  </div>

  <h1>服务器实时监控</h1>

  <div class="info">
    <div class="item">内存总量：<span class="v" id="i-mem-total">-</span></div>
    <div class="item">CPU使用率：<span class="v" id="i-cpu">-</span></div>
    <div class="item">磁盘总量：<span class="v" id="i-disk-total">-</span></div>
    <div class="item">网卡：<span class="v" id="i-netif">-</span></div>
    <div class="item">已用内存：<span class="v" id="i-mem-used">-</span></div>
    <div class="item">1分钟负载：<span class="v" id="i-load">-</span></div>
    <div class="item">磁盘使用率：<span class="v" id="i-disk-percent">-</span></div>
    <div class="item">网络：<span class="v" id="i-net">-</span></div>
  </div>

  <div class="ranges" id="ranges"><!-- JS 渲染 --></div>

  <div class="toggles">
    <label><input type="checkbox" id="ck-mem" checked> 内存</label>
    <label><input type="checkbox" id="ck-cpu" checked> CPU</label>
    <label><input type="checkbox" id="ck-disk" checked> 磁盘</label>
    <label><input type="checkbox" id="ck-net" checked> 网络</label>
  </div>

  <div class="card">
    <div id="chart"></div>
    <!-- 图表上的离线遮罩 -->
    <div class="offline-mask" id="offlineMask" hidden>
      <div class="big">主服务器离线</div>
      <div class="sub" id="maskSub">连接 api.php 失败，正在自动重试…</div>
    </div>
  </div>

  <div class="status" id="status">正在连接…</div>
</div>

<!-- ECharts（bootcdn 优先，失败自动换源） -->
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<script>
if (typeof echarts === 'undefined') {
  document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"><\/script>');
}
</script>

<script>
(function () {
  'use strict';

  /* ================= 配置 ================= */
  const API_BASE   = 'https://热血燃烧.cn/api.php'; // 后端接口（跨域）
  const API_TOKEN  = '';        // 与 api.php 的 API_TOKEN 一致；不用就留空
  const RT_MS      = 1000;      // 实时模式刷新间隔（毫秒）
  const HIS_MS     = 5000;      // 历史模式刷新间隔（毫秒）
  const OFFLINE_MS = 3000;      // 判定离线后的重试间隔（毫秒）
  const TIMEOUT_MS = 5000;      // 单次请求超时（毫秒）→ 超时即视为连不上
  const MAX_POINTS = 300;       // 实时模式最多保留点数

  /* ================= 曲线定义 ================= */
  const SERIES = [
    { key:'mem',  name:'已用内存(MB)',   color:'#2563eb', yIndex:0 },
    { key:'cpu',  name:'CPU使用率(%)',   color:'#f59e0b', yIndex:1 },
    { key:'disk', name:'磁盘使用率(%)',  color:'#84cc16', yIndex:1 },
    { key:'down', name:'下载速率(KB/s)', color:'#3b82f6', yIndex:2 },
    { key:'up',   name:'上传速率(KB/s)', color:'#ef4444', yIndex:2 }
  ];
  const NAME_OF = k => (SERIES.find(s => s.key === k) || {}).name;

  const CHECKS = [
    { id:'ck-mem',  keys:['mem'] },
    { id:'ck-cpu',  keys:['cpu'] },
    { id:'ck-disk', keys:['disk'] },
    { id:'ck-net',  keys:['down', 'up'] }
  ];

  const RANGES = [
    { key:'realtime', text:'实时' },
    { key:'half',     text:'半小时' },
    { key:'1h',       text:'1小时' },
    { key:'6h',       text:'6小时' },
    { key:'24h',      text:'24小时' }
  ];
  const SPAN = { realtime:0, half:1800, '1h':3600, '6h':21600, '24h':86400 };

  /* ================= 状态 ================= */
  let range       = 'realtime';
  let points      = [];
  let timer       = null;
  let timerIv     = null;
  let busy        = false;
  let online      = null;        // null=未知, true=在线, false=离线
  let lastOnlineAt= null;        // 最后一次成功通信的时间
  let offlineSince= null;        // 开始离线的时间
  let failReason  = '';
  let everOnline  = false;

  const legendSelected = {};
  SERIES.forEach(s => legendSelected[s.name] = true);

  const $ = id => document.getElementById(id);
  const chart = echarts.init($('chart'));

  /* ================= 工具 ================= */
  function fmt(v, digits) {
    if (v === null || v === undefined || v === '' || isNaN(v)) return '-';
    const n = Number(v);
    const d = digits === undefined ? (Math.abs(n) >= 1000 ? 0 : 2) : digits;
    return n.toLocaleString('en-US', { maximumFractionDigits: d });
  }
  function num(v) {
    if (v === null || v === undefined || v === '') return null;
    const n = Number(v);
    return isNaN(n) ? null : n;
  }
  function first(obj, keys) {
    for (let i = 0; i < keys.length; i++) {
      const v = obj[keys[i]];
      if (v !== undefined && v !== null && v !== '') return v;
    }
    return null;
  }
  const pad2 = n => (n < 10 ? '0' + n : '' + n);
  function hhmmss(ts) {
    if (!ts) return '未知';
    const d = new Date(ts);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }
  function fmtTime(d, span) {
    const hm = (span >= 21600 ? pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' : '')
             + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    return span >= 21600 ? hm : hm + ':' + pad2(d.getSeconds());
  }
  function labelFrom(raw, span) {
    if (raw === null || raw === undefined || raw === '') return fmtTime(new Date(), span);
    if (typeof raw === 'number' || /^\d+$/.test(String(raw))) {
      let ms = Number(raw);
      if (ms < 1e12) ms *= 1000;
      const d = new Date(ms);
      if (!isNaN(d.getTime())) return fmtTime(d, span);
    }
    return String(raw);
  }
  function setStatus(text, cls) {
    const el = $('status');
    el.textContent = text;
    el.className = 'status' + (cls ? ' ' + cls : '');
  }
  function showFlash(text) {
    const el = document.createElement('div');
    el.className = 'flash';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  /* ================= 离线 / 在线 状态切换 ================= */
  function markOnline() {
    const recovered = (online === false);
    sharedOnlineBookkeeping();
    online = true;
    lastOnlineAt = Date.now();
    offlineSince = null;
    failReason = '';
    everOnline = true;

    document.body.classList.remove('is-offline');
    $('offlineBanner').hidden = true;
    $('offlineMask').hidden = true;
    document.title = '服务器实时监控';

    restartTimer();
    if (recovered) showFlash('主服务器已恢复连接');
  }

  function markOffline(reason) {
    const wasOnline = (online === false);
    online = false;
    failReason = reason;
    if (!wasOnline) offlineSince = Date.now();   // 首次进入离线

    document.body.classList.add('is-offline');
    $('offlineBanner').hidden = false;
    $('offlineMask').hidden = false;
    document.title = '⚠ 主服务器离线 · 服务器实时监控';

    const sec = offlineSince ? Math.floor((Date.now() - offlineSince) / 1000) : 0;
    const txt = '无法连接 ' + API_BASE + '（' + reason + '）'
      + ' · 最后在线 ' + (lastOnlineAt ? hhmmss(lastOnlineAt) : '未知')
      + (everOnline ? ' · 已离线 ' + sec + ' 秒' : '');
    $('offlineDetail').textContent = txt;
    $('maskSub').textContent = '连接 api.php 失败：' + reason + '，正在自动重试（每 '
      + Math.round(OFFLINE_MS / 1000) + ' 秒）…';
    setStatus('主服务器离线 · ' + txt, 'err');

    restartTimer();
  }
  function sharedOnlineBookkeeping() { /* 预留 */ }

  // 每秒刷新“已离线 X 秒”
  setInterval(function () {
    if (online !== false || !offlineSince) return;
    const sec = Math.floor((Date.now() - offlineSince) / 1000);
    const txt = '无法连接 ' + API_BASE + '（' + failReason + '）'
      + ' · 最后在线 ' + (lastOnlineAt ? hhmmss(lastOnlineAt) : '未知')
      + ' · 已离线 ' + sec + ' 秒';
    $('offlineDetail').textContent = txt;
    setStatus('主服务器离线 · ' + txt, 'err');
  }, 1000);

  /* ================= 数据归一化 ================= */
  function normalizeSample(raw, span) {
    if (!raw || typeof raw !== 'object') return null;
    const s = {
      label:        labelFrom(first(raw, ['time', 'label', 'datetime', 'created_at', 't', 'ts', 'timestamp']), span),
      mem_total:    num(first(raw, ['mem_total', 'memTotal', 'memory_total', 'ram_total'])),
      mem_used:     num(first(raw, ['mem_used', 'memUsed', 'memory_used', 'ram_used', 'used_mem', 'mem'])),
      mem_percent:  num(first(raw, ['mem_percent', 'memPercent', 'memory_percent', 'mem_usage', 'mem_rate'])),
      disk_total:   num(first(raw, ['disk_total', 'diskTotal'])),
      disk_used:    num(first(raw, ['disk_used', 'diskUsed'])),
      disk_percent: num(first(raw, ['disk_percent', 'diskPercent', 'disk_usage', 'disk_rate', 'disk'])),
      cpu:          num(first(raw, ['cpu', 'cpu_percent', 'cpuPercent', 'cpu_usage', 'cpu_rate'])),
      load1:        num(first(raw, ['load1', 'load_1', 'loadavg', 'load_avg_1', 'load'])),
      net_if:       first(raw, ['net_if', 'netif', 'nic', 'iface', 'interface', 'net_card']) || '',
      net_down:     num(first(raw, ['net_down', 'netDown', 'down', 'download', 'rx', 'rx_kbs', 'down_kbs'])),
      net_up:       num(first(raw, ['net_up', 'netUp', 'up', 'upload', 'tx', 'tx_kbs', 'up_kbs']))
    };
    if (s.mem_percent === null && s.mem_total && s.mem_used !== null) {
      s.mem_percent = s.mem_used / s.mem_total * 100;
    }
    return s;
  }
  const toPoint = s => ({ label:s.label, mem:s.mem_used, cpu:s.cpu, disk:s.disk_percent, down:s.net_down, up:s.net_up });

  function unwrap(json) {
    if (json && typeof json === 'object' && ('code' in json || 'success' in json || 'status' in json)) {
      const ok = json.code === 0 || json.code === 200 || json.code === '0'
              || json.success === true || json.status === true || json.status === 'ok';
      if (!ok) throw new Error(json.message || json.msg || '接口返回失败');
      return ('data' in json) ? json.data : json;
    }
    return json;
  }

  /* ================= 顶部
